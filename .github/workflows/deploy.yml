name: Deploy ContactHub to EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: contacthub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | python3 -c '
          import sys, json, base64

          response = json.load(sys.stdin)
          payload = response["value"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("SUBJECT:", claims.get("sub"))
          print("AUDIENCE:", claims.get("aud"))
          print("REPOSITORY:", claims.get("repository"))
          print("REF:", claims.get("ref"))
          '

          echo "Stopping after identity check."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::642299167654:role/ContactHub-GitHub-Deploy-Role
          aws-region: us-east-1
          role-session-name: ContactHubDeployment

      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | python3 -c '
          import sys, json, base64
          response = json.load(sys.stdin)
          payload = response["value"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("SUBJECT:", claims.get("sub"))
          print("AUDIENCE:", claims.get("aud"))
          print("REPOSITORY:", claims.get("repository"))
          print("REF:", claims.get("ref"))
          '

      - name: Start EC2 deployment
        id: command
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-026cee16f13dfa8d5 \
            --document-name ContactHub-Deploy \
            --comment "ContactHub deployment from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started SSM command: $COMMAND_ID"

      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-026cee16f13dfa8d5

      - name: Show deployment result
        if: always() && steps.command.outputs.command_id != ''
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-026cee16f13dfa8d5 \
            --query '{Status:Status,Details:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Verify HTTPS website
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 \
            --max-time 30 \
            https://contacthub.duckdns.org/ > /dev/null

          echo "ContactHub HTTPS check passed."
