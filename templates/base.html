<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ContactHub simple contact management system">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}ContactHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page_name %}{% endblock %}" data-is-admin="{{ 'true' if is_admin else 'false' }}" data-login-url="{{ url_for('login', next=url_for('contacts', action='add')) }}" data-manage-login-url="{{ url_for('login', next=url_for('contacts')) }}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <nav class="navbar navbar-expand-md app-navbar" aria-label="Primary navigation">
    <div class="container">
      <a class="navbar-brand brand-lockup" href="{{ url_for('dashboard') }}">
        <span class="brand-mark" aria-hidden="true">CH</span>
        <span>ContactHub</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav"
              aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="primaryNav">
        <ul class="navbar-nav ms-auto gap-md-2">
          <li class="nav-item"><a class="nav-link{% if active_page == 'dashboard' %} active{% endif %}" {% if active_page == 'dashboard' %}aria-current="page"{% endif %} href="{{ url_for('dashboard') }}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link{% if active_page == 'contacts' %} active{% endif %}" {% if active_page == 'contacts' %}aria-current="page"{% endif %} href="{{ url_for('contacts') }}">Contacts</a></li>
          {% if is_admin %}
          <li class="nav-item">
            <form method="post" action="{{ url_for('logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="nav-link border-0" type="submit">Sign out</button>
            </form>
          </li>
          {% else %}
          <li class="nav-item"><a class="nav-link{% if active_page == 'login' %} active{% endif %}" {% if active_page == 'login' %}aria-current="page"{% endif %} href="{{ url_for('login') }}">Admin sign in</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
      <span>&copy; 2026 ContactHub</span>
      <span>ITP16 Final Requirement &middot; Flask and SQLite</span>
    </div>
  </footer>
  {% block modals %}{% endblock %}
  <div id="toastRegion" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
