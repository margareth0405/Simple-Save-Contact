
name: Deploy ContactHub to EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: contacthub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-01ac1b93aac6c8d59
      SSM_DOCUMENT: ContactHub-Deploy

    steps:
      # STEP 1: Verify GitHub OIDC identity
      - name: Check GitHub OIDC Identity
        shell: bash
        run: |
          echo "Checking GitHub OIDC identity..."

          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | python3 -c '
          import sys, json, base64

          response = json.load(sys.stdin)
          token = response["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          print("Repository:", claims.get("repository"))
          print("Environment: production")
          print("Ref:", claims.get("ref"))
          '

      # STEP 2: Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::642299167654:role/ContactHub-GitHub-Deploy-Role
          aws-region: us-east-1
          role-session-name: ContactHubDeployment
          role-duration-seconds: 3600

      # STEP 3: Verify AWS authentication
      - name: Verify AWS Identity
        shell: bash
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity
          echo "AWS authentication successful."

      # STEP 4: Start SSM deployment
      - name: Start EC2 Deployment
        id: command
        shell: bash
        run: |
          echo "Starting ContactHub deployment..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --comment "ContactHub deployment from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started SSM command: $COMMAND_ID"

      # STEP 5: Wait for deployment completion
      - name: Wait for Deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          echo "Waiting for SSM deployment..."

          for i in $(seq 1 180); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "ContactHub deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated)
                echo "ContactHub deployment failed."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1

      # STEP 6: Display deployment output
      - name: Show Deployment Result
        if: ${{ always() && steps.command.outputs.command_id != '' }}
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          echo "Retrieving deployment result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Details:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      # STEP 7: Verify the live HTTPS website
      - name: Verify HTTPS Website
        shell: bash
        run: |
          echo "Checking ContactHub website..."

          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 3 \
            --retry-connrefused \
            --max-time 30 \
            https://contacthub.duckdns.org/ > /dev/null

          echo "ContactHub HTTPS check passed."

      # STEP 8: Confirm deployment completion
      - name: Deployment Summary
        shell: bash
        run: |
          echo "=================================="
          echo "ContactHub Deployment Successful"
          echo "=================================="
          echo "AWS Region: us-east-1"
          echo "EC2 Instance: $INSTANCE_ID"
          echo "Domain: https://contacthub.duckdns.org"
          echo "Deployment: GitHub Actions + AWS SSM"
          echo "=================================="
